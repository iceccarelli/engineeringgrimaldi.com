name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: |
          npx next start -p 3099 > /tmp/srv.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3099/ && break; sleep 1; done
          ./scripts/verify.sh http://localhost:3099
          kill $PID 2>/dev/null || true
